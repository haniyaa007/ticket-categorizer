[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-categorizer"
version = "0.1.0"
description = "Automated support-ticket categorizer, clusterer and L1/L2 router for AI SaaS products."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]  # TODO: fill in
keywords = ["support", "tickets", "triage", "clustering", "embeddings", "llm", "saas"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/ticket-categorizer"  # TODO
Issues = "https://github.com/YOUR_GITHUB_USERNAME/ticket-categorizer/issues"  # TODO

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
ml = ["sentence-transformers>=2.7"]
llm = ["anthropic>=0.40"]
zendesk = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.27"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sentence-transformers>=2.7", "anthropic>=0.40", "httpx>=0.27"]

[project.scripts]
ticketsorter = "ticketsorter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticketsorter = ["defaults/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
